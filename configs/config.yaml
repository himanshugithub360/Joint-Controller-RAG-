# Top-level config. Pick a scale profile with:  profile=lite  (default) or  profile=full
# Load from Python with budgetrag.config.load_config(); every script saves the resolved
# config next to its outputs.
defaults:
  - profile: lite
  - _self_

project: joint-controller-rag

paths:
  data: data                 # relative to the repo root unless absolute
  raw: ${paths.data}/raw
  splits: ${paths.data}/splits
  questions: ${paths.data}/questions.parquet
  reports: reports
  third_party: third_party
  # Search-R1's corpus and E5 index (scripts/download.py of Search-R1). Put on an SSD:
  # exact search streams the whole 60 GB index once per batch of queries.
  wiki18: ${paths.data}/wiki18
  index_parts: [part_aa, part_ab]
  corpus_gz: ${paths.wiki18}/wiki-18.jsonl.gz
  corpus_jsonl: ${paths.wiki18}/wiki-18.jsonl
  corpus_offsets: ${paths.wiki18}/wiki-18.offsets.npy
  retrieval_memo: ${paths.data}/retrieval_memo.sqlite
  retrieval_cache: ${paths.data}/retrieval_cache.parquet
  passages: ${paths.data}/passages.parquet

seeds:
  data: 42                    # every data sample
  train: [0, 1, 2, 3, 4]      # one training run per seed

flashrag:
  hf_repo: RUC-NLPIR/FlashRAG_datasets
  # dataset -> split used for testing (same as Search-R1 / AutoSearch)
  test_split:
    nq: test
    hotpotqa: dev
    triviaqa: test
    popqa: test
    2wikimultihopqa: dev
    musique: dev
    bamboogle: test
  # train sets the training pool, validation and live fine-tuning sets are drawn from
  train_sources: [nq, hotpotqa]

tokenizer: Qwen/Qwen2.5-7B-Instruct   # counts question tokens; renders Stage 3+ chat prompts (same template for all Qwen2.5 sizes)

# Stage 3: prompts, decoding and the Kaggle round trip. Decoding is greedy for every call.
llm:
  prompt_version: v1          # configs/prompts/<version>/*.txt
  seed: 0
  gpu_memory_utilization: 0.90
  batch_size: 256             # prompts per vLLM generate() call (timing is logged per batch)
  calls:                      # call kind -> prompt file, decoding limits
    answer:    {prompt: answer.txt,        max_tokens: 32, stop: ["\n"]}
    closed:    {prompt: answer_nodocs.txt, max_tokens: 32, stop: ["\n"]}
    tentative: {prompt: tentative.txt,     max_tokens: 32, stop: ["</answer>"]}
    subquery:  {prompt: subquery.txt,      max_tokens: 48, stop: ["\n"]}
  stage3:
    k: 3                      # passages in each Stage 3 prompt
    determinism_n: 200        # answer prompts generated twice per tier
    jobs: kaggle/inputs/stage3_jobs.jsonl.gz   # committed: Kaggle reads it from the repo
    outputs: ${paths.data}/stage3              # Kaggle output files go here (S.jsonl, ...)
  # Stage 4: pilot and tier-gap gate. Three Kaggle rounds, with E5 retrieval of the new
  # sub-queries on the workstation between them (scripts/s04_pilot.py).
  stage4:
    val_k: [3]                # validation: the fixed 3-step path 3-3-3 and its prefixes
    pilot_split: train_pool   # cost pilot: the full Stage 6 tree on a sample of this split
    pilot_per_source: 250     # -> 500 questions (250 NQ + 250 HotpotQA)
    max_depth: 3
    gate_min_gap: 3.0         # F1 points between neighbouring tiers, top-3 retrieval, validation
    try_fallback: [S]         # also run models.fallback for these tiers (Stage 3 showed M - S = 2.2)
    k_change_min: 0.01        # keep K = 5 unless it changes the answer on fewer than 1% of node pairs
    jobs_dir: kaggle/inputs   # stage4_r{1,2,3}.jsonl.gz (committed; Kaggle reads them from the repo)
    outputs: ${paths.data}/stage4   # unzip stage4_r<N>.zip into <outputs>/r<N>/
    kaggle_quota_h: 30        # Kaggle GPU hours per week (session time, any number of GPUs)
