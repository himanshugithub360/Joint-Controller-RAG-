# @package _global_
# "lite" profile: fits this workstation (1x Quadro P4000 8 GB, 64 GB RAM, CPU training)
# plus free Kaggle GPUs (2x T4 16 GB, ~30 GPU-hours/week). See README "Scale".
profile_name: lite

models:
  # Tiers S < M < L. Kaggle T4 supports float16, not bfloat16.
  tiers:
    # S was Qwen2.5-1.5B until the Stage 4 gate (M - S = +2.1 < 3 points); replaced by the
    # planned fallback, 0.5B (M - S = +11.4). See reports/STAGE_4_REPORT.md.
    S: Qwen/Qwen2.5-0.5B-Instruct
    M: Qwen/Qwen2.5-3B-Instruct
    L: Qwen/Qwen2.5-7B-Instruct
  helper: Qwen/Qwen2.5-1.5B-Instruct   # sub-queries and tentative answers (kept when S changed)
  # Stage 4 gate fallbacks: a smaller S if M - S is too small, a larger L if L - M is.
  fallback: {S: Qwen/Qwen2.5-0.5B-Instruct, L: Qwen/Qwen2.5-14B-Instruct}
  fallback_label: {S: XS, L: XL}
  dtype: float16
  tensor_parallel: {S: 1, M: 1, L: 2}
  max_model_len: 4096
  retriever: intfloat/e5-base-v2

retrieval:
  # Same retriever and index as Search-R1 (E5-base-v2, flat, 21M passages). The 60 GB
  # index does not fit in RAM, so it is searched exactly on CPU by streaming it from the
  # SSD in chunks (src/budgetrag/retrieval/flat_index.py); one pass serves a whole batch.
  primary: e5
  topk: 10
  K_choices: [3, 5]

splits:
  per_source:                  # drawn from each of flashrag.train_sources
    train_pool: 2500           # -> 5,000 questions
    val: 250                   # -> 500
    live_ft: 250               # -> 500
  test_per_dataset: 500        # sampled from each test split; null = whole split
