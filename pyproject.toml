[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetrag"
version = "0.1.0"
description = "Budget-constrained joint retrieval and LLM routing controller (M.Tech thesis code)"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs data/raw and data/questions.parquet (run scripts/s01_make_splits.py first)",
]
