# Local (Windows, CPU) environment: everything except LLM serving.
# Used for data prep, BM25, features, simulator, controller training (BC + PPO-Lagrangian),
# evaluation statistics and plots. LLM calls run on Kaggle (see envs/kaggle-requirements.txt).
#
#   conda env create -f envs/local.yml
#   conda activate budgetrag
#   pip install -e .
name: budgetrag
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.5.1
      - transformers==4.46.3
      - huggingface_hub>=0.26,<1.0
      - datasets==3.1.0
      - faiss-cpu==1.9.0
      - bm25s==0.2.5
      - PyStemmer==2.2.0.3
      - gymnasium==0.28.1
      - omnisafe==0.5.0
      - numpy<2
      - pandas==2.0.3            # pinned exactly by omnisafe 0.5.0
      - pyarrow==18.1.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - scipy==1.14.1
      - scikit-learn==1.5.2
      - matplotlib==3.9.3
      - wandb==0.18.7
      - pytest==8.3.4
      - tqdm
